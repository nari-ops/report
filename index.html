<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>作業員 稼働集計レポート 2026年5月・2026年6月・2026年7月・2026年8月</title>
<style>
:root{
  --bg:#0f1e4a;--panel:#1a2f6a;--panel2:#243b77;
  --accent:#00b8a9;--white:#fff;--text2:#a8c4f0;--text3:#5b7ba8;
  --cell-empty:#162354;--sun:#ff6b6b;--sat:#6bb5ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:"Meiryo UI","メイリオ",sans-serif;min-height:100vh;}
header{background:var(--panel);padding:14px 24px;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.2rem;font-weight:700;}
header span{color:var(--text2);font-size:0.82rem;}
.controls{background:var(--panel);padding:10px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--panel2);}
.controls label{color:var(--text2);font-size:0.85rem;}
select{background:var(--panel2);color:var(--white);border:1px solid var(--text3);border-radius:6px;padding:5px 10px;font-size:0.88rem;font-family:inherit;cursor:pointer;}
.content{padding:18px 22px;}
/* Tab */
.view-tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{padding:5px 14px;border-radius:20px;border:1px solid var(--panel2);background:transparent;color:var(--text2);cursor:pointer;font-size:0.8rem;font-family:inherit;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}
.view{display:none;}.view.active{display:block;}
/* Month groups row */
.month-groups{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.month-group{flex:1;min-width:180px;background:var(--panel);border-radius:10px;overflow:hidden;}
.mg-header{padding:9px 14px;font-size:0.95rem;font-weight:700;color:#fff;}
.mg-c1{background:#00b8a9;}.mg-c2{background:#2563eb;}.mg-c3{background:#7c3aed;}.mg-c4{background:#db2777;}.mg-c5{background:#d97706;}
.mg-metric{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--panel2);}
.mg-metric:last-child{border-bottom:none;}
.mg-metric:nth-child(odd){background:var(--panel2);}
.mg-label{font-size:0.8rem;color:var(--text2);}
.mg-value{font-size:1.35rem;font-weight:700;}
.mv-c1{color:#00b8a9;}.mv-c2{color:#93c5fd;}.mv-c3{color:#c4b5fd;}.mv-c4{color:#f9a8d4;}.mv-c5{color:#fcd34d;}
/* Calendars */
.cal-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.cal-wrap{background:var(--panel);border-radius:10px;overflow:hidden;}
.cal-header{padding:8px 12px;font-size:0.9rem;font-weight:700;color:#fff;}
.ch-c1{background:#00b8a9;}.ch-c2{background:#2563eb;}.ch-c3{background:#7c3aed;}.ch-c4{background:#db2777;}.ch-c5{background:#d97706;}
table.cal{width:100%;border-collapse:collapse;}
.cal th{padding:4px 2px;font-size:0.68rem;text-align:center;background:var(--panel2);font-weight:600;}
.cal th.sun{color:var(--sun);}.cal th.sat{color:var(--sat);}
.cal td{padding:0;border:1px solid #1a3070;width:14.28%;}
.cal-cell{min-height:48px;display:flex;flex-direction:column;align-items:center;padding:2px 1px;}
.cal-cell.empty{background:var(--cell-empty);}
.cal-cell.blank{background:var(--bg);min-height:48px;}
.cal-cell.wc1{background:rgba(0,184,169,.22);}
.cal-cell.wc2{background:rgba(37,99,235,.22);}
.cal-cell.wc3{background:rgba(124,58,237,.22);}
.cal-cell.wc4{background:rgba(219,39,119,.22);}
.cal-cell.wc5{background:rgba(217,119,6,.22);}
.day-num{font-size:0.72rem;font-weight:600;color:var(--text3);margin-bottom:1px;}
.cal-cell.wc1 .day-num,.cal-cell.wc2 .day-num,.cal-cell.wc3 .day-num,.cal-cell.wc4 .day-num,.cal-cell.wc5 .day-num{color:var(--white);}
.day-h{font-size:0.62rem;font-weight:700;}
.dh-c1{color:#00b8a9;}.dh-c2{color:#93c5fd;}.dh-c3{color:#c4b5fd;}.dh-c4{color:#f9a8d4;}.dh-c5{color:#fcd34d;}
.day-k{font-size:0.58rem;color:var(--text2);}
/* Summary - card grid */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:4px;}
.sum-card{background:var(--panel);border-radius:10px;overflow:hidden;}
.sum-card-name{padding:10px 14px;font-size:1rem;font-weight:700;color:var(--white);background:var(--panel2);border-left:4px solid var(--accent);}
.sum-months{display:flex;gap:0;}
.sum-month{flex:1;overflow:hidden;}
.sum-month-hdr{padding:5px 6px;font-size:0.75rem;font-weight:700;color:#fff;text-align:center;}
.sum-mhdr-c1{background:#00b8a9;}.sum-mhdr-c2{background:#2563eb;}.sum-mhdr-c3{background:#7c3aed;}.sum-mhdr-c4{background:#db2777;}.sum-mhdr-c5{background:#d97706;}
.sum-metric{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-top:1px solid var(--panel2);}
.sum-metric:nth-child(even){background:rgba(255,255,255,.03);}
.sum-metric-lbl{font-size:0.64rem;color:var(--text3);margin-bottom:2px;}
.sum-metric-val{font-size:1.05rem;font-weight:700;}
.sum-val-c1{color:#00b8a9;}.sum-val-c2{color:#93c5fd;}.sum-val-c3{color:#c4b5fd;}.sum-val-c4{color:#f9a8d4;}.sum-val-c5{color:#fcd34d;}
/* zero month */
.sum-metric-val.zero{color:var(--text3);font-size:0.85rem;}

/* ===== Schedule / Gantt (div-based layout) ===== */
.sched-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.sched-controls label{color:var(--text2);font-size:0.85rem;margin-right:4px;}
.month-btn{padding:4px 14px;border-radius:20px;border:1px solid var(--panel2);background:transparent;color:var(--text2);cursor:pointer;font-size:0.8rem;font-family:inherit;}
.month-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}

/* Gantt container */
.gantt-container{width:100%;overflow-x:auto;background:var(--panel);border-radius:10px;overflow:hidden;}
.gantt-row{display:flex;align-items:stretch;border-bottom:1px solid #1a3070;min-height:36px;}
.gantt-row:last-child{border-bottom:none;}
.gantt-row.header-row{background:var(--panel2);min-height:28px;border-bottom:2px solid var(--accent);}

/* Date label column */
.gantt-date{flex:0 0 72px;width:72px;padding:4px 8px;font-size:0.78rem;display:flex;align-items:center;background:var(--panel);white-space:nowrap;border-right:1px solid #1a3070;font-weight:600;color:var(--text2);}
.gantt-date.sun{color:var(--sun);}
.gantt-date.sat{color:var(--sat);}
.gantt-date.hdr{color:var(--text3);font-size:0.72rem;font-weight:400;}

/* Bar area column */
.gantt-bar{flex:1;position:relative;min-height:36px;background:var(--cell-empty);}
.gantt-bar.working{background:#192e5c;}
.gantt-bar.hdr{background:var(--panel2);min-height:28px;}

/* Hour grid lines (rendered as absolute divs inside bar area) */
.htick{position:absolute;top:0;bottom:0;width:1px;background:rgba(91,123,168,.18);pointer-events:none;z-index:1;}
.htick.major{background:rgba(91,123,168,.45);}

/* Time axis labels */
.haxis-label{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:0.62rem;color:var(--text3);white-space:nowrap;pointer-events:none;z-index:2;}

/* Work blocks */
.gblock{position:absolute;top:5px;bottom:5px;border-radius:4px;overflow:hidden;cursor:default;z-index:3;display:flex;align-items:center;}
.gblock:hover{opacity:.82;z-index:10;}
.gblock-lbl{font-size:0.6rem;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000;font-weight:700;line-height:1.2;}

/* Tooltip */
.g-tooltip{position:fixed;background:rgba(15,30,74,.97);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:0.82rem;pointer-events:none;z-index:9999;display:none;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.g-tooltip .tt-site{font-weight:700;color:var(--accent);margin-bottom:4px;font-size:0.9rem;}
.g-tooltip .tt-time{color:var(--text2);}

/* Legend */
.gantt-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:0.74rem;color:var(--text2);}
.legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
</style>
</head>

const COLORS = ['c1','c2','c3','c4','c5'];

// Gantt time range: 6:00 - 26:00 (allows work that crosses midnight shown as up to 02:00)
const GSTART = 6 * 60;    // 360
const GEND   = 26 * 60;   // 1560
const GRANGE = GEND - GSTART; // 1200

const BLOCK_COLORS = [
  '#00b8a9','#2563eb','#7c3aed','#db2777','#d97706',
  '#16a34a','#0891b2','#b45309','#4338ca','#be185d'
];
const siteColorMap = {};
let siteColorIdx = 0;
function siteColor(site){
  if(!siteColorMap[site]){
    siteColorMap[site] = BLOCK_COLORS[siteColorIdx % BLOCK_COLORS.length];
    siteColorIdx++;
  }
  return siteColorMap[site];
}

let currentUser = null;
let currentSchedMonth = MONTHS[0];

/* ---------- helpers ---------- */
function fmtH(h){
  if(h==null)return'-';
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(hh===0)return mm+'m';
  return mm>0?hh+'h'+String(mm).padStart(2,'0')+'m':hh+'h';
}
function getSummary(days,ym){
  const f=days.filter(d=>d[0].startsWith(ym));
  return{days:f.length,hours:f.reduce((a,b)=>a+b[1],0),kensu:f.reduce((a,b)=>a+b[2],0)};
}
function buildMap(days,ym){
  const m={};
  days.filter(d=>d[0].startsWith(ym)).forEach(d=>{m[+d[0].split('-')[2]]={h:d[1],k:d[2]};});
  return m;
}
function daysInMonth(y,mo){return new Date(y,mo,0).getDate();}
function firstDay(y,mo){return new Date(y,mo-1,1).getDay();}
function mlabel(ym){const[y,m]=ym.split('-').map(Number);return y+'年'+m+'月';}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function timeToMin(t){
  const parts=t.split(':');
  const hh=parseInt(parts[0],10), mm=parseInt(parts[1]||'0',10);
  let total=hh*60+mm;
  if(hh<6) total+=24*60; // midnight-crossing -> treat as next-day
  return total;
}
function minToHHMM(total){
  const hh=Math.floor(total/60)%24, mm=total%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function pct(v){ return (v/GRANGE*100).toFixed(3)+'%'; }
function leftPct(startMin){ return ((startMin-GSTART)/GRANGE*100).toFixed(3)+'%'; }

/* ---------- calendar ---------- */
function buildCalTable(tableEl,y,m,dayMap,cls){
  const dim=daysInMonth(y,m),fd=firstDay(y,m);
  const days=['日','月','火','水','木','金','土'];
  let h='<thead><tr>'+days.map((d,i)=>'<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+ d+'</th>').join('')+'</tr></thead><tbody>';
  let day=1,pos=0;
  for(let row=0;row<6;row++){
    h+='<tr>';
    for(let col=0;col<7;col++){
      if(pos<fd||day>dim){
        h+='<td><div class="cal-cell blank"></div></td>';
      }else{
        const info=dayMap[day];
        const wcls=info?'wc'+cls.slice(-1):'empty';
        h+='<td><div class="cal-cell '+wcls+'"><span class="day-num">'+day+'</span>';
        if(info)h+='<span class="day-h dh-'+cls+'">'+fmtH(info.h)+'</span><span class="day-k">'+info.k+'件</span>';
        h+='</div></td>';
        day++;
      }
      pos++;
    }
    h+='</tr>';
    if(day>dim&&pos>=fd+dim)break;
  }
  h+='</tbody>';
  tableEl.innerHTML=h;
}

/* ---------- showUser ---------- */
function showUser(code){
  currentUser=code;
  const d=DATA[code];

  // month group cards
  const mg=document.getElementById('monthGroups');
  mg.innerHTML='';
  MONTHS.forEach((ym,i)=>{
    const cls=COLORS[i%COLORS.length];
    const s=getSummary(d.d,ym);
    const div=document.createElement('div');
    div.className='month-group';
    div.innerHTML=
      '<div class="mg-header mg-'+cls+'">'+mlabel(ym)+'</div>'+
      '<div class="mg-metric"><span class="mg-label">稼働日数</span><span class="mg-value mv-'+cls+'">'+s.days+'日</span></div>'+
      '<div class="mg-metric"><span class="mg-label">稼働時間</span><span class="mg-value mv-'+cls+'">'+fmtH(s.hours)+'</span></div>'+
      '<div class="mg-metric"><span class="mg-label">稼働件数</span><span class="mg-value mv-'+cls+'">'+s.kensu+'件</span></div>';
    mg.appendChild(div);
  });

  // calendars
  const cs=document.getElementById('calSection');
  cs.innerHTML='';
  MONTHS.forEach((ym,i)=>{
    const cls=COLORS[i%COLORS.length];
    const[y,m]=ym.split('-').map(Number);
    const map=buildMap(d.d,ym);
    const wrap=document.createElement('div');
    wrap.className='cal-wrap';
    wrap.innerHTML='<div class="cal-header ch-'+cls+'">'+mlabel(ym)+'</div>';
    const table=document.createElement('table');
    table.className='cal';
    wrap.appendChild(table);
    cs.appendChild(wrap);
    buildCalTable(table,y,m,map,cls);
  });

  buildScheduleMonthBtns();
  buildGantt(currentUser, currentSchedMonth);
}

/* ---------- schedule month buttons ---------- */
function buildScheduleMonthBtns(){
  const container=document.getElementById('monthBtns');
  container.innerHTML='';
  MONTHS.forEach(ym=>{
    const btn=document.createElement('button');
    btn.className='month-btn'+(ym===currentSchedMonth?' active':'');
    btn.textContent=mlabel(ym);
    btn.onclick=()=>{
      currentSchedMonth=ym;
      document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      buildGantt(currentUser,currentSchedMonth);
    };
    container.appendChild(btn);
  });
}

/* ---------- GANTT (div-based) ---------- */
function buildGantt(userCode, ym){
  const container=document.getElementById('ganttContainer');
  const legend=document.getElementById('ganttLegend');
  if(!userCode||!DATA[userCode]){container.innerHTML='';return;}

  const d=DATA[userCode];
  const[year,month]=ym.split('-').map(Number);
  const dim=daysInMonth(year,month);

  // Collect sites for legend & colour-map
  const sitesInMonth=new Set();
  for(let day=1;day<=dim;day++){
    const ds=ym+'-'+String(day).padStart(2,'0');
    ((d.r&&d.r[ds])||[]).forEach(r=>sitesInMonth.add(r.site));
  }

  // Hour ticks: every hour from GSTART to GEND
  const ticks=[];
  for(let m2=GSTART;m2<=GEND;m2+=60) ticks.push(m2);

  // Build HTML
  const rows=[];

  // ---- header row (time axis) ----
  let tickHtml='';
  ticks.forEach(m2=>{
    const lp=leftPct(m2);
    const isMajor=(m2%360===0);
    const label=String(Math.floor(m2/60)%24).padStart(2,'0')+':00';
    tickHtml+='<div class="htick'+(isMajor?' major':'')+'" style="left:'+lp+'"></div>';
    tickHtml+='<div class="haxis-label" style="left:'+lp+'">'+label+'</div>';
  });
  rows.push(
    '<div class="gantt-row header-row">'+
    '<div class="gantt-date hdr">日付</div>'+
    '<div class="gantt-bar hdr" style="position:relative;">'+tickHtml+'</div>'+
    '</div>'
  );

  // ---- data rows ----
  const DOW_LABEL=['日','月','火','水','木','金','土'];
  for(let day=1;day<=dim;day++){
    const ds=ym+'-'+String(day).padStart(2,'0');
    const dow=new Date(ds+'T12:00:00').getDay(); // noon prevents timezone edge cases
    const recs=(d.r&&d.r[ds])||[];
    const hasWork=recs.length>0;
    const dowClass=dow===0?'sun':dow===6?'sat':'';

    // tick lines for this row
    let rowTicks='';
    ticks.forEach(m2=>{
      rowTicks+='<div class="htick'+(m2%360===0?' major':'')+'" style="left:'+leftPct(m2)+'"></div>';
    });

    // work blocks
    let blockHtml='';
    recs.forEach(r=>{
      const startMin=timeToMin(r.s);
      if(startMin>=GEND||startMin<GSTART) return;
      const durMin=Math.round(r.dur*60);
      const endMin=Math.min(startMin+durMin,GEND);
      const vis=endMin-startMin;
      if(vis<=0) return;

      const lp=leftPct(startMin);
      const wp=pct(vis);
      const col=siteColor(r.site);
      const endT=minToHHMM(startMin+durMin);

      blockHtml+=
        '<div class="gblock"'+
        ' style="left:'+lp+';width:'+wp+';background:'+col+';"'+
        ' data-site="'+escH(r.site)+'"'+
        ' data-start="'+escH(r.s)+'"'+
        ' data-end="'+escH(endT)+'"'+
        ' data-dur="'+escH(fmtH(r.dur))+'"'+
        ' onmouseenter="showTip(event,this)" onmouseleave="hideTip()">'+
        '<div class="gblock-lbl">'+escH(r.site)+'</div>'+
        '</div>';
    });

    rows.push(
      '<div class="gantt-row">'+
      '<div class="gantt-date '+dowClass+'">'+day+'日('+DOW_LABEL[dow]+')</div>'+
      '<div class="gantt-bar'+(hasWork?' working':'')+'" style="position:relative;">'+
      rowTicks+blockHtml+
      '</div>'+
      '</div>'
    );
  }

  container.innerHTML='<div class="gantt-container">'+rows.join('')+'</div>';

  // Legend
  legend.innerHTML='';
  if(sitesInMonth.size>0){
    const lbl=document.createElement('span');
    lbl.style.cssText='color:var(--text3);font-size:0.74rem;';
    lbl.textContent='現場: ';
    legend.appendChild(lbl);
    Array.from(sitesInMonth).sort().forEach(site=>{
      const item=document.createElement('div');
      item.className='legend-item';
      item.innerHTML='<div class="legend-dot" style="background:'+siteColor(site)+'"></div><span>'+escH(site)+'</span>';
      legend.appendChild(item);
    });
  }
}

/* ---------- Tooltip ---------- */
const tooltip=document.getElementById('tooltip');
function showTip(e,el){
  tooltip.innerHTML=
    '<div class="tt-site">'+escH(el.dataset.site)+'</div>'+
    '<div class="tt-time">'+escH(el.dataset.start)+' 〜 '+escH(el.dataset.end)+'　('+escH(el.dataset.dur)+')</div>';
  tooltip.style.display='block';
  moveTip(e);
}
function moveTip(e){
  let x=e.clientX+14,y=e.clientY-10;
  const tw=tooltip.offsetWidth||220,th=tooltip.offsetHeight||60;
  if(x+tw>window.innerWidth-10) x=e.clientX-tw-14;
  if(y+th>window.innerHeight-10) y=e.clientY-th-10;
  tooltip.style.left=x+'px';tooltip.style.top=y+'px';
}
function hideTip(){tooltip.style.display='none';}
document.addEventListener('mousemove',e=>{if(tooltip.style.display==='block')moveTip(e);});

/* ---------- view switch ---------- */
function switchView(v,evt){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  if(evt)evt.target.classList.add('active');
}
